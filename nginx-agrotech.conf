# ==============================================================================
# AGRO TECH · QUANTUM NEXUS C.A. (RIF: J-508019512) · Nginx Server Production Configuration Block
# High-Performance HTTP/2, Caching, AI Crawler Support & Security Headers
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name agrotech.com.ve www.agrotech.com.ve; # Reemplazar con el dominio definitivo
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agrotech.com.ve www.agrotech.com.ve;

    # Directorio raíz del proyecto
    root /var/www/agrotech_web;
    index index.html;

    # Codificación de caracteres predeterminada
    charset utf-8;

    # 1. SSL Certificates (Ajustar rutas con Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/agrotech.com.ve/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/agrotech.com.ve/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    # 2. Compresión GZIP & Brotli
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # 3. Cabeceras de Seguridad y E-E-A-T
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 4. Caché de Activos Estáticos (1 año inmutable para imágenes y tipografías)
    location ~* \.(?:ico|jpg|jpeg|png|gif|webp|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 5. Caché para CSS y JavaScript (30 días)
    location ~* \.(?:css|js)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # 6. Archivos Especiales para Motores de IA y SEO (robots, sitemap, llms.txt)
    location ~* ^/(?:robots\.txt|sitemap\.xml|llms\.txt|llms-full\.txt)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # 7. Rutas limpias y fallback SPA / Jamstack
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 8. Páginas de error personalizadas
    error_page 404 /index.html;
}

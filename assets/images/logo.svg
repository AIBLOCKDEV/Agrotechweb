<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <style>
      .logo-text {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 52px;
        letter-spacing: 0.22em;
        fill: #1c1d1d;
      }
      .dark-mode .logo-text {
        fill: #f3f2ee;
      }
      .leaf-fill {
        fill: #355E32;
      }
      .stem {
        stroke: #355E32;
        stroke-width: 5.5;
        stroke-linecap: round;
        fill: none;
      }
      .vein {
        stroke: #ffffff;
        stroke-width: 2.2;
        stroke-linecap: round;
        fill: none;
        opacity: 0.7;
      }
    </style>
  </defs>

  <!-- Group for leaves and stem icon -->
  <g transform="translate(300, 75)">
    <!-- Stem -->
    <path d="M 0,32 Q -1,15 -3,0" class="stem" />
    
    <!-- Left Leaf -->
    <path d="M -3,0 C -18,-2 -34,-12 -38,-28 C -36,-38 -20,-42 -4,-28 C 4,-20 0,-5 -3,0 Z" class="leaf-fill" />
    <path d="M -4,-2 C -15,-12 -26,-24 -32,-30" class="vein" />
    
    <!-- Right Leaf -->
    <path d="M -3,0 C 14,-2 32,-14 36,-32 C 34,-42 16,-46 0,-30 C -8,-22 -3,-5 -3,0 Z" class="leaf-fill" />
    <path d="M -3,-2 C 12,-12 24,-24 30,-32" class="vein" />
  </g>

  <!-- Typography -->
  <text x="300" y="155" text-anchor="middle" class="logo-text">AGRO TECH</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#121312" />
  <!-- RF / LoRa Antennae -->
  <polyline points="26,16 20,9 13,7" stroke="#58B957" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <polyline points="38,16 44,9 51,7" stroke="#58B957" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="12" cy="7" r="3" fill="#F4F3EE" />
  <circle cx="52" cy="7" r="3" fill="#F4F3EE" />

  <!-- 6 Bold PCB IC-Pin Legs (High readability at 16x16px) -->
  <polyline points="20,28 12,28 7,19" stroke="#58B957" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="6.5" cy="18.5" r="2.6" fill="#F4F3EE" />
  <polyline points="44,28 52,28 57,19" stroke="#58B957" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="57.5" cy="18.5" r="2.6" fill="#F4F3EE" />

  <polyline points="19,38 9,38 5,42" stroke="#58B957" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="4.5" cy="42.5" r="2.6" fill="#F4F3EE" />
  <polyline points="45,38 55,38 59,42" stroke="#58B957" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="59.5" cy="42.5" r="2.6" fill="#F4F3EE" />

  <polyline points="21,48 12,48 8,56" stroke="#58B957" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="7.5" cy="56.5" r="2.6" fill="#F4F3EE" />
  <polyline points="43,48 52,48 56,56" stroke="#58B957" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="56.5" cy="56.5" r="2.6" fill="#F4F3EE" />

  <!-- Optical Sensor Head -->
  <polygon points="24,15 40,15 42,23 22,23" fill="#4E9E4C" />
  <circle cx="28" cy="19" r="1.9" fill="#F4F3EE" />
  <circle cx="36" cy="19" r="1.9" fill="#F4F3EE" />

  <!-- Microchip Beetle Carapace -->
  <polygon points="20,25 44,25 46,32 45,48 38,57 26,57 19,48 18,32" fill="#4E9E4C" />
  <!-- Bold Inner Silicon Die -->
  <rect x="25.5" y="32" width="13" height="13" rx="1.8" stroke="#F4F3EE" stroke-width="2.2" fill="none" />
  <rect x="29.2" y="35.7" width="5.6" height="5.6" fill="#F4F3EE" />
  <line x1="32" y1="25" x2="32" y2="32" stroke="#F4F3EE" stroke-width="2" />
  <line x1="32" y1="45" x2="32" y2="57" stroke="#F4F3EE" stroke-width="2" />
</svg>
